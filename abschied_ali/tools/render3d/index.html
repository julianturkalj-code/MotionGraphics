<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#e9e8e4}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const P=new URLSearchParams(location.search);
const W=+P.get('w')||1600, H=+P.get('h')||1200, painted=P.get('paint')!=='0', view=P.get('view')||'hero';
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H); r.setPixelRatio(1); r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.05; r.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xe9e8e4);
const pm=new THREE.PMREMGenerator(r); scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
new STLLoader().load('model.stl',g=>{
  g.computeBoundingBox(); const bb=g.boundingBox;
  const pos=g.attributes.position, nrm=g.attributes.normal, n=pos.count, col=new Float32Array(n*3);
  const zt=bb.max.z;
  for(let i=0;i<n;i+=3){
    const z=(pos.getZ(i)+pos.getZ(i+1)+pos.getZ(i+2))/3, nz=nrm.getZ(i);
    let c=[0.86,0.87,0.88];
    if(painted && nz>0.9 && z<zt-1.0) c=[0.035,0.035,0.04];
    for(let k=0;k<3;k++){col[(i+k)*3]=c[0];col[(i+k)*3+1]=c[1];col[(i+k)*3+2]=c[2];}
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.translate(-(bb.min.x+bb.max.x)/2,-(bb.min.y+bb.max.y)/2,0);
  const m=new THREE.MeshStandardMaterial({vertexColors:true,metalness:0.85,roughness:0.32});
  const mesh=new THREE.Mesh(g,m); mesh.castShadow=true; mesh.receiveShadow=true;
  const grp=new THREE.Group(); grp.add(mesh);
  grp.rotation.x=-Math.PI/2; // liegt auf dem Tisch, Oberseite nach oben
  scene.add(grp);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),new THREE.ShadowMaterial({opacity:0.22}));
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
  const sun=new THREE.DirectionalLight(0xffffff,2.2); sun.position.set(-250,420,260); sun.castShadow=true;
  sun.shadow.mapSize.set(4096,4096); const sc=sun.shadow.camera; sc.left=-250;sc.right=250;sc.top=250;sc.bottom=-250;sc.near=10;sc.far=1500;
  sun.shadow.bias=-0.0004; scene.add(sun);
  scene.add(new THREE.HemisphereLight(0xffffff,0x888888,0.5));
  const cam=new THREE.PerspectiveCamera(view==='detail'?22:30,W/H,1,5000);
  if(view==="detail"){cam.position.set(60,120,95); cam.lookAt(0,0,-20);}
  else if(view==='top'){cam.position.set(0,620,60); cam.lookAt(0,0,5);}
  else {cam.position.set(60,600,400); cam.lookAt(0,0,22);}
  r.render(scene,cam); window.__done=true;
});
</script></body></html>
